<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade3.0 | Peterley Auguste | Graphic Designer</title>
    <meta
      name="description"
      content="Portfolio de Peterley Auguste, Graphic Designer freelance"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://unpkg.com/phosphor-icons"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/images/logos/GradeLogo.png"
    />
  </head>

  <body class="bg-white w-full">
    <nav id="navbar" class="block w-full lg:max-w-[80%] mx-auto px-4 py-2 lg:px-6 lg:py-3 sticky top-2 lg:top-4 bg-white/90 backdrop-blur-lg backdrop-brightness-150 border border-white/20 shadow-t-lg lg:shadow-lg lg:rounded-lg z-50 transition-all duration-300 ease-in-out">
      <div class="flex items-center justify-between mx-auto text-text">
        <!-- Logo à gauche -->
        <div class="flex items-center">
          <a href="#accueil" class="flex items-center cursor-pointer text-lg text-purple-600 hover:text-orange-600 font-semibold whitespace-nowrap">
            <img src="assets/images/logos/GradeLogo.png" alt="Grade3.0 Logo" class="block h-8 w-auto mr-2 logo-animate" />
            Grade3.0
          </a>
          <!-- Séparateur visible uniquement sur desktop -->
          <span class="hidden lg:inline-block h-5 border-l border-gray-900/30 ml-6"></span>
        </div>

        <!-- Menu principal (Desktop + Mobile unifiés) -->
        <div id="navMenu" class="hidden lg:flex lg:flex-1 lg:justify-center">
          <ul class="flex flex-col lg:flex-row items-center lg:items-center list-none gap-4 lg:gap-3">
            <li>
              <a href="#accueil" class="nav-link text-purple-600 hover:text-orange-600 px-2 py-1 text-sm whitespace-nowrap transition-colors duration-200">
                Accueil
              </a>
            </li>
            <li>
              <a href="#projets" class="nav-link text-purple-600 hover:text-orange-600 px-2 py-1 text-sm whitespace-nowrap transition-colors duration-200">
                Portfolio
              </a>
            </li>
            <li>
              <a href="#apropos" class="nav-link text-purple-600 hover:text-orange-600 px-2 py-1 text-sm whitespace-nowrap transition-colors duration-200">
                À propos
              </a>
            </li>
            <li>
              <a href="#competences" class="nav-link text-purple-600 hover:text-orange-600 px-2 py-1 text-sm whitespace-nowrap transition-colors duration-200">
                Services
              </a>
            </li>
            <li>
              <a href="#contact" class="nav-link text-purple-600 hover:text-orange-600 px-2 py-1 text-sm whitespace-nowrap transition-colors duration-200">
                Contact
              </a>
            </li>
            <!-- Bouton CV dans le menu mobile uniquement -->
            <li class="lg:hidden w-full mt-2 pt-2 border-t border-gray-200">
              <a href="/assets/images/logos/cv_peterleyauguste_graphicdesigner.pdf" class="inline-flex items-center gap-2 bg-orange-600 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-300 w-full justify-center" download>
                <i class="ph ph-file-arrow-down-bold"></i>
                <span>Mon CV</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Bouton CV desktop et menu toggle -->
        <div class="flex items-center gap-2">
          <!-- Bouton CV desktop (visible seulement sur desktop) -->
          <div class="hidden lg:flex items-center">
            <span class="inline-block h-5 border-l border-gray-900/30 mr-4"></span>
            <a href="/assets/images/logos/cv_peterleyauguste_graphicdesigner.pdf" class="inline-flex items-center gap-2 bg-orange-600 text-white hover:bg-transparent hover:border-2 hover:border-orange-600 hover:text-orange-600 font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 active:border active:border-primary whitespace-nowrap" download>
              <i class="ph ph-file-arrow-down-bold"></i>
              <span>Mon CV</span>
            </a>
          </div>

          <!-- Menu toggle mobile -->
          <button id="menuToggle" aria-label="Toggle navigation" aria-expanded="false" class="lg:hidden flex items-center justify-center h-10 w-10 select-none rounded-lg text-center align-middle text-xs font-medium uppercase text-inherit transition-all">
            <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>
    

    <!-- Placeholders pour les sections -->
    <!-- Hero Section -->
    <section id="hero-section" class="">
    </section>

    <!-- Projects Section -->
    <section id="projects-section" class="py-6 lg:py-12 bg-gray-50
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials-section" class="pt-6 pb-3 lg:pt-6 lg:pb-6 bg-gray-100
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- About Section -->
    <section id="about-section" class="py-3 lg:py-6 bg-gray-100
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- Skills Section -->
    <section id="skills-section" class="py-6 lg:py-12 bg-gray-50
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- Contact Section -->
    <section id="contact-section" class="py-6 lg:py-12 bg-gray-50
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- Footer Section -->
    <section id="footer-section" class="pt-6 lg:pt-12 bg-gray-50
        opacity-0 translate-y-10 transition-all duration-700 ease-out">
    </section>

    <!-- Bouton flottant Back-to-top -->
    <button 
      id="backToTop" 
      class="fixed bottom-6 right-6 lg:bottom-20 lg:right-6 bg-transparent backdrop-blur-lg text-orange-600 lg:text-xl
            px-3 py-2 lg:px-4 lg:py-3 rounded-full shadow-lg animate-pulse hover:scale-105 hover:animate-none
            transition-all duration-300 hidden">
      <i class="ph ph-arrow-up-bold"></i>
    </button>

      <!-- Modal d'alerte pour liens non actifs -->
<div id="alertModal" class="fixed inset-0 flex items-center justify-center z-[100] hidden">
  <!-- Overlay avec blur -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
  
  <!-- Contenu du modal -->
  <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6 md:p-8 transform transition-all duration-300 scale-95 opacity-0" id="alertModalContent">
    <!-- Icône d'alerte -->
    <div class="flex justify-center mb-4">
      <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center">
        <i class="ph ph-lock text-4xl text-orange-600"></i>
      </div>
    </div>

    <!-- Message -->
    <p class="text-gray-600 text-center mb-6 leading-relaxed">
      Non disponible pour l'instant !<br>
      <span class="text-sm text-gray-500">Merci de contacter le propriétaire du site pour plus d'informations y concernant.</span>
    </p>
    
    <!-- Bouton de fermeture -->
    <div class="flex justify-center">
      <button id="closeAlertModal" class="bg-orange-600 hover:bg-purple-600 text-white font-semibold py-2 px-8 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2">
        Compris
      </button>
    </div>
    
    <!-- Bouton fermer (croix) -->
    <button id="closeAlertModalCross" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
      <i class="ph ph-x text-2xl"></i>
    </button>
  </div>
</div>


    <script type="module" src="js/main.js"></script>
  </body>
</html>
