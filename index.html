<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade3.0 | Peterley Auguste | Graphic Designer</title>
    <meta
      name="description"
      content="Portfolio de Peterley Auguste, Graphic Designer freelance"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/images/logos/GradeLogo.png"
    />
  </head>
  <body>
    <!-- Navigation (reste en place) -->
    <nav
      id="navbar"
      class="nav-menu block w-full max-w-screen-lg px-3 py-2 mx-auto bg-light/80 sticky top-3 shadow lg:px-6 lg:py-3 backdrop-blur-lg backdrop-saturate-150 border border-neutral rounded-lg z-[9999]"
    >
      <div
        class="container relative flex items-center justify-between mx-auto text-text h-10"
      >
        <!-- Logo (flex-1 lg:absolute lg:left-0) -->
        <div
          class="flex items-center flex-1 lg:absolute lg:inset-y-0 lg:left-0"
        >
          <a
            href="#"
            class="flex items-center cursor-pointer text-lg text-dark font-semibold"
          >
            <img
              src="assets/images/logos/GradeLogo.png"
              alt="Grade3.0 Logo"
              class="h-8 w-auto mr-2 logo-animate"
            />
            Grade3.0
          </a>
        </div>

        <!-- Liens au centre (hidden lg:flex lg:justify-center) -->
        <div id="navMenu" class="hidden lg:flex lg:justify-center lg:w-full">
          <ul class="flex gap-6 list-none">
            <li>
              <a
                href="#accueil"
                class="nav-link --secondary-color hover:text-primary"
              >
                Accueil
              </a>
            </li>
            <li>
              <a
                href="#projets"
                class="nav-link --secondary-color hover:text-primary"
              >
                Portfolio
              </a>
            </li>
            <li>
              <a
                href="#apropos"
                class="nav-link --secondary-color hover:text-primary"
              >
                À propos
              </a>
            </li>
            <li>
              <a
                href="#competences"
                class="nav-link --secondary-color hover:text-primary"
              >
                Services
              </a>
            </li>
            <li>
              <a
                href="#contact"
                class="nav-link --secondary-color hover:text-primary"
              >
                Contact
              </a>
            </li>
          </ul>
        </div>

        <!-- Bouton CV à droite (hidden lg:absolute lg:flex lg:right-0) -->
        <div
          class="hidden lg:absolute lg:flex lg:items-center lg:justify-end lg:inset-y-0 lg:right-0"
        >
          <a
            href=""
            class="inline-flex items-center gap-2 bg-primary hover:bg-secondary text-light font-semibold py-2 px-4 rounded transition duration-300"
            download
          >
            <i class="fas fa-download"></i>
            <span>Mon CV</span>
          </a>
        </div>

        <!-- Menu toggle mobile -->
        <button
          id="menuToggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          class="relative h-6 w-6 select-none rounded-lg text-center align-middle text-xs font-medium uppercase text-inherit transition-all lg:hidden"
        >
          <span
            class="absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
          >
            <svg
              id="menuOpenIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </span>
        </button>
      </div>

      <!-- Menu mobile dropdown -->
      <div
        id="navMenuMobile"
        class="hidden lg:hidden border-t border-neutral mt-2 pt-2"
      >
        <ul class="flex flex-col gap-2 list-none items-center">
          <li>
            <a
              href="#accueil"
              class="nav-link --secondary-color hover:text-primary block py-2"
            >
              Accueil
            </a>
          </li>
          <li>
            <a
              href="#projets"
              class="nav-link --secondary-color hover:text-primary block py-2"
            >
              Portfolio
            </a>
          </li>
          <li>
            <a
              href="#apropos"
              class="nav-link --secondary-color hover:text-primary block py-2"
            >
              À propos
            </a>
          </li>
          <li>
            <a
              href="#competences"
              class="nav-link --secondary-color hover:text-primary block py-2"
            >
              Services
            </a>
          </li>
          <li>
            <a
              href="#contact"
              class="nav-link --secondary-color hover:text-primary block py-2"
            >
              Contact
            </a>
          </li>
          <li class="mt-2 pt-2 border-t border-neutral">
            <a
              href=""
              class="inline-flex items-center gap-2 bg-primary hover:bg-secondary text-light font-semibold py-2 px-4 rounded transition duration-300 w-full justify-center"
              download
            >
              <i class="fas fa-download"></i>
              <span>Mon CV</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Placeholders pour les sections -->
    <div id="hero-section"></div>
    <div id="projects-section"></div>
    <div id="testimonials-section"></div>
    <div id="about-section"></div>
    <div id="skills-section"></div>
    <div id="contact-section"></div>
    <div id="footer-section"></div>

    <!-- Bouton retour en haut -->
    <button class="back-to-top" id="backToTop" aria-label="Retour en haut">
      <i class="fas fa-chevron-up"></i>
    </button>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
